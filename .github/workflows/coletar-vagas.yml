name: Coletar vagas

on:
  schedule:
    - cron: '0 9 * * 1' # todo dia às 09:00 UTC (~06:00 no horário de Brasília)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rodar coletor de vagas
        run: node scripts/collect-vagas.js

      - name: Commitar vagas.json se houver mudança
        run: |
          git config user.name "estagio-zero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vagas.json
          git diff --cached --quiet || git commit -m "chore: atualizar radar de vagas"
          git push
